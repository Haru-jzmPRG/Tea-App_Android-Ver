navigationCompose = "2.9.3"
lifecycle = "2.9.2"
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
ksp = "2.2.10-2.0.2"
room = "2.7.2"
datastore = "1.1.7"
